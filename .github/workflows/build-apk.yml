name: Build AquaDingo APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Compilar APK com imagem oficial do Buildozer
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            -w /home/user/hostcwd \
            kivy/buildozer android debug

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: AquaDingo-apk
          path: bin/*.apk
